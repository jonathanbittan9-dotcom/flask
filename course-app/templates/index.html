<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Four Tracks to Mastery — Flask, os, JavaScript, CSS</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/course.css') }}">
</head>
<body>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <span class="sub">Four tracks · one stack</span>
      <h1>From first route to mastery</h1>
      <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
        <button class="ghost-btn" id="go-home">← Dashboard</button>
        <button class="ghost-btn" id="go-lab">⌨ Playground</button>
      </div>
    </div>

    <nav class="tracks" aria-label="Tracks">
      <div class="track-group">
        <span class="group-label">Runs on the server</span>
        <div class="track-btns" id="grp-server"></div>
      </div>
      <div class="track-group">
        <span class="group-label">Runs in the browser</span>
        <div class="track-btns" id="grp-client"></div>
      </div>
    </nav>

    <div class="finder">
      <input type="search" id="finder" placeholder="Filter lessons…" aria-label="Filter lessons">
    </div>

    <div class="syllabus" id="syllabus"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-right">
        <span class="chip" id="chip-streak" title="Consecutive days studied"></span>
        <span class="chip level" id="chip-level" title="Experience earned"></span>
        <div class="overall" title="Lessons marked complete">
          <span class="bar"><i id="overall-bar"></i></span>
          <span id="overall-txt">0 / 0</span>
        </div>
        <button class="ghost-btn" id="theme-toggle" title="Switch light and dark">Theme</button>
        <button class="ghost-btn rail-toggle" id="rail-toggle" aria-expanded="false">Syllabus</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/data/00-course.js') }}"></script>
  <script src="{{ url_for('static', filename='js/data/01-track-flask.js') }}"></script>
  <script src="{{ url_for('static', filename='js/data/02-track-os.js') }}"></script>
  <script src="{{ url_for('static', filename='js/data/03-track-js.js') }}"></script>
  <script src="{{ url_for('static', filename='js/data/04-track-css.js') }}"></script>
  <script src="{{ url_for('static', filename='js/data/05-quiz.js') }}"></script>
  <script src="{{ url_for('static', filename='js/data/06-fill.js') }}"></script>
  <script src="{{ url_for('static', filename='js/data/07-placement.js') }}"></script>
  <script src="{{ url_for('static', filename='js/data/08-attach.js') }}"></script>
  <script src="{{ url_for('static', filename='js/data/09-lesson-content.js') }}"></script>
  <script src="{{ url_for('static', filename='js/engine.js') }}"></script>
</body>
</html>
