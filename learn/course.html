<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Four Tracks to Mastery — Flask, os, JavaScript, CSS</title>
<style>
  /* minimal reset — the artifact host normally provides this */
  *, *::before, *::after { box-sizing: border-box; }
  body, h1, h2, h3, p, ul, figure { margin: 0; }
  ul { padding: 0; }
  img, svg { display: block; max-width: 100%; }
  button, input, textarea { font: inherit; color: inherit; }
</style>
</head>
<body>
<style>
/* ─────────────────────────────────────────────────────────────
   TOKENS
   Neutrals are biased green-grey toward the teal accent.
   Category hues encode where the code runs, not arbitrary tags.
   ───────────────────────────────────────────────────────────── */
:root {
  --bg:        #EDF0EE;
  --surface:   #FBFCFB;
  --surface-2: #E4E9E6;
  --ink:       #14201E;
  --ink-soft:  #33433F;
  --muted:     #596763;
  --line:      #D2D9D6;
  --line-soft: #E1E7E4;
  --accent:    #0E7C70;
  --accent-ink:#0A5A51;
  --accent-wash:#DCEBE8;
  --server:    #2F4E93;
  --server-wash:#DFE5F3;
  --client:    #A96A22;
  --client-wash:#F2E6D6;
  --code-bg:   #16211F;
  --code-ink:  #DCE6E2;

  /* VS Code Dark+ token colours. Code always sits on a dark ground here,
     in both page themes, so one set is correct throughout. */
  --tok-key:   #569CD6;   /* declarations: def, class, const, import   */
  --tok-ctl:   #C586C0;   /* control flow: if, for, return, try        */
  --tok-str:   #CE9178;
  --tok-num:   #B5CEA8;
  --tok-com:   #6A9955;
  --tok-fn:    #DCDCAA;   /* function names                             */
  --tok-type:  #4EC9B0;   /* classes and built-in types                 */
  --tok-var:   #9CDCFE;   /* self, this, attributes, css properties     */
  --tok-dec:   #DCDCAA;
  --tok-sel:   #D7BA7D;   /* css selectors                              */
  --tok-tag:   #569CD6;   /* html tags                                  */
  --tok-caret: #AEAFAD;

  --ff-display: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --ff-body: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --ff-mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", "Roboto Mono", monospace;

  --s1: .25rem;  --s2: .5rem;   --s3: .75rem;  --s4: 1rem;
  --s5: 1.5rem;  --s6: 2rem;    --s7: 3rem;    --s8: 4.5rem;

  --rail: 20.5rem;
  --measure: 68ch;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #0E1614;
    --surface:   #16211F;
    --surface-2: #1D2A27;
    --ink:       #E4EBE8;
    --ink-soft:  #C3CFCB;
    --muted:     #8FA09B;
    --line:      #27332F;
    --line-soft: #1F2B28;
    --accent:    #45C4B2;
    --accent-ink:#7FDACC;
    --accent-wash:#12302C;
    --server:    #8FA9E2;
    --server-wash:#1A2440;
    --client:    #E0A868;
    --client-wash:#33260F;
    --code-bg:   #0A100F;
    --code-ink:  #D3DEDA;
  }
}
:root[data-theme="dark"] {
  --bg:        #0E1614;
  --surface:   #16211F;
  --surface-2: #1D2A27;
  --ink:       #E4EBE8;
  --ink-soft:  #C3CFCB;
  --muted:     #8FA09B;
  --line:      #27332F;
  --line-soft: #1F2B28;
  --accent:    #45C4B2;
  --accent-ink:#7FDACC;
  --accent-wash:#12302C;
  --server:    #8FA9E2;
  --server-wash:#1A2440;
  --client:    #E0A868;
  --client-wash:#33260F;
  --code-bg:   #0A100F;
  --code-ink:  #D3DEDA;
}
:root[data-theme="light"] {
  --bg:        #EDF0EE;
  --surface:   #FBFCFB;
  --surface-2: #E4E9E6;
  --ink:       #14201E;
  --ink-soft:  #33433F;
  --muted:     #596763;
  --line:      #D2D9D6;
  --line-soft: #E1E7E4;
  --accent:    #0E7C70;
  --accent-ink:#0A5A51;
  --accent-wash:#DCEBE8;
  --server:    #2F4E93;
  --server-wash:#DFE5F3;
  --client:    #A96A22;
  --client-wash:#F2E6D6;
  --code-bg:   #16211F;
  --code-ink:  #DCE6E2;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ff-body);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

:where(a) { color: var(--accent-ink); text-underline-offset: .18em; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 3px;
}

/* ── App shell ───────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100vh;
}

/* ── Rail ────────────────────────────────────────────────── */
.rail {
  border-right: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
}

.brand {
  padding: var(--s5) var(--s5) var(--s4);
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.brand h1 {
  font-family: var(--ff-display);
  font-size: 1.3rem;
  font-weight: 600;
  line-height: 1.2;
  margin: 0;
  letter-spacing: -.01em;
  text-wrap: balance;
}
.brand .sub {
  font-family: var(--ff-mono);
  font-size: .68rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Track switcher: grouped by where the code runs */
.tracks { padding: var(--s4) var(--s4) var(--s3); display: flex; flex-direction: column; gap: var(--s4); }
.track-group { display: flex; flex-direction: column; gap: var(--s2); }
.group-label {
  font-family: var(--ff-mono);
  font-size: .62rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: var(--s2);
}
.group-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}
.track-btns { display: flex; gap: var(--s2); }

.track-btn {
  flex: 1;
  appearance: none;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink-soft);
  border-radius: 2px;
  padding: var(--s2) var(--s2) calc(var(--s2) + 2px);
  font-family: var(--ff-mono);
  font-size: .74rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 5px;
  text-align: left;
  transition: border-color .15s, background .15s, color .15s;
}
.track-btn:hover { border-color: var(--hue); color: var(--ink); }
.track-btn[aria-pressed="true"] {
  border-color: var(--hue);
  background: var(--hue-wash);
  color: var(--ink);
}
.track-btn .meter {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.track-btn .meter > i {
  display: block;
  height: 100%;
  background: var(--hue);
  transition: width .3s ease;
}
.track-btn .count {
  font-size: .62rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.track-btn[data-side="server"] { --hue: var(--server); --hue-wash: var(--server-wash); }
.track-btn[data-side="client"] { --hue: var(--client); --hue-wash: var(--client-wash); }

/* Search */
.finder { padding: 0 var(--s4) var(--s3); }
.finder input {
  width: 100%;
  font-family: var(--ff-mono);
  font-size: .78rem;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: var(--s2) var(--s3);
}
.finder input::placeholder { color: var(--muted); }

/* Syllabus list */
.syllabus {
  flex: 1;
  overflow-y: auto;
  padding: 0 var(--s3) var(--s6);
  scrollbar-width: thin;
}
.syl-item {
  display: grid;
  grid-template-columns: 1.9rem 1fr;
  gap: var(--s2);
  align-items: baseline;
  width: 100%;
  text-align: left;
  appearance: none;
  background: transparent;
  border: 0;
  border-left: 2px solid transparent;
  color: var(--ink-soft);
  padding: 7px var(--s3);
  cursor: pointer;
  font: inherit;
  font-size: .84rem;
  line-height: 1.35;
  border-radius: 0 2px 2px 0;
}
.syl-item:hover { background: var(--surface-2); color: var(--ink); }
.syl-item[aria-current="true"] {
  background: var(--surface-2);
  border-left-color: var(--hue);
  color: var(--ink);
  font-weight: 600;
}
.syl-item .n {
  font-family: var(--ff-mono);
  font-size: .68rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.syl-item[data-done="1"] .n { color: var(--accent); }
.syl-item[data-done="1"] .n::after { content: "\2713"; margin-left: 2px; }
.syl-item[data-planned="1"] .t { color: var(--muted); font-style: italic; }
.syl-item[hidden] { display: none; }

.syl-empty {
  padding: var(--s4) var(--s3);
  font-size: .82rem;
  color: var(--muted);
}

/* ── Main column ─────────────────────────────────────────── */
.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
  padding: var(--s3) var(--s6);
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 5;
  flex-wrap: wrap;
}
.crumbs {
  font-family: var(--ff-mono);
  font-size: .7rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: var(--s2);
}
.crumbs .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--hue);
}
.crumbs .side { color: var(--hue); }

.topbar-right { display: flex; align-items: center; gap: var(--s4); }
.overall {
  display: flex;
  align-items: center;
  gap: var(--s2);
  font-family: var(--ff-mono);
  font-size: .7rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.overall .bar { width: 84px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.overall .bar > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }

.ghost-btn {
  appearance: none;
  font-family: var(--ff-mono);
  font-size: .7rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 5px var(--s3);
  cursor: pointer;
}
.ghost-btn:hover { color: var(--ink); border-color: var(--muted); }

/* ── Lesson ──────────────────────────────────────────────── */
.lesson {
  padding: var(--s7) var(--s6) var(--s8);
  max-width: calc(var(--measure) + 8rem);
  width: 100%;
}

.lesson-head { display: flex; flex-direction: column; gap: var(--s3); margin-bottom: var(--s6); }
.eyebrow {
  font-family: var(--ff-mono);
  font-size: .7rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--hue);
  display: flex;
  align-items: center;
  gap: var(--s3);
}
.eyebrow .rule { flex: 1; height: 1px; background: var(--line); max-width: 8rem; }
.lesson h2 {
  font-family: var(--ff-display);
  font-size: clamp(1.85rem, 1.3rem + 1.8vw, 2.7rem);
  line-height: 1.1;
  font-weight: 600;
  letter-spacing: -.02em;
  margin: 0;
  text-wrap: balance;
  max-width: 22ch;
}
.lesson .standfirst {
  font-size: 1.06rem;
  color: var(--muted);
  max-width: var(--measure);
  margin: 0;
  text-wrap: pretty;
}

.body { max-width: var(--measure); display: flex; flex-direction: column; gap: var(--s4); }
.body > h3 {
  font-family: var(--ff-display);
  font-size: 1.28rem;
  font-weight: 600;
  letter-spacing: -.01em;
  margin: var(--s4) 0 0;
  text-wrap: balance;
}
.body > p { margin: 0; text-wrap: pretty; }
.body > ul { margin: 0; padding-left: 1.15rem; display: flex; flex-direction: column; gap: var(--s2); }
.body li::marker { color: var(--accent); }

code {
  font-family: var(--ff-mono);
  font-size: .875em;
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  border-radius: 3px;
  padding: .08em .34em;
  word-break: break-word;
}

/* Code blocks */
.block {
  background: var(--code-bg);
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.block-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px var(--s3) 6px var(--s4);
  border-bottom: 1px solid #ffffff14;
}
.block-top .lang {
  font-family: var(--ff-mono);
  font-size: .64rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #8c9c98;
}
.copy {
  appearance: none;
  background: transparent;
  border: 1px solid #ffffff1f;
  color: #9db0ab;
  font-family: var(--ff-mono);
  font-size: .64rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 2px;
  cursor: pointer;
}
.copy:hover { color: #e6efec; border-color: #ffffff40; }
.block pre {
  margin: 0;
  padding: var(--s4);
  overflow-x: auto;
  font-family: var(--ff-mono);
  font-size: .82rem;
  line-height: 1.62;
  color: var(--code-ink);
  tab-size: 4;
}
.block pre code { background: none; border: 0; padding: 0; font-size: inherit; }

.tok-kw   { color: var(--tok-key); }
.tok-ctl  { color: var(--tok-ctl); }
.tok-str  { color: var(--tok-str); }
.tok-num  { color: var(--tok-num); }
.tok-com  { color: var(--tok-com); font-style: italic; }
.tok-fn   { color: var(--tok-fn); }
.tok-type { color: var(--tok-type); }
.tok-var  { color: var(--tok-var); }
.tok-prop { color: var(--tok-var); }
.tok-attr { color: var(--tok-var); }
.tok-dec  { color: var(--tok-dec); }
.tok-sel  { color: var(--tok-sel); }
.tok-tag  { color: var(--tok-tag); }

/* ── Highlighted editor: a coloured <pre> under a transparent textarea ── */
.ed {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  background: var(--code-bg);
  min-height: 0;
  overflow: hidden;
}
.ed:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; }
.ed-body { position: relative; min-width: 0; }
/* Two classes deep so these beat .lab textarea and .code-area, which are
   (0,1,1) and (0,1,0) — otherwise the textarea stays opaque and you would
   see the plain text painted over the coloured layer. */
.ed .ed-layer {
  margin: 0;
  border: 0;
  padding: var(--s3) var(--s4);
  font-family: var(--ff-mono);
  font-size: .86rem;
  line-height: 1.65;
  letter-spacing: normal;
  tab-size: 4;
  white-space: pre;
  word-wrap: normal;
  box-sizing: border-box;
  overflow: auto;
}
.ed .ed-hl {
  position: absolute;
  inset: 0;
  pointer-events: none;
  color: var(--code-ink);
  z-index: 0;
  scrollbar-width: none;
}
.ed .ed-hl::-webkit-scrollbar { width: 0; height: 0; }
.ed .ed-hl code { font: inherit; background: none; border: 0; padding: 0; }
.ed .ed-input {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  min-height: 9rem;
  background: transparent;
  color: transparent;
  caret-color: var(--tok-caret);
  resize: vertical;
  outline: none;
}
.ed .ed-input::selection { background: #264F78; color: transparent; }

/* Fill mode: the editor stretches to its container instead of its content. */
.ed[data-fill="1"] { flex: 1; min-height: 0; }
.ed[data-fill="1"] .ed-body { height: 100%; }
.ed[data-fill="1"] .ed-input { height: 100%; min-height: 0; resize: none; }

.ed .ed-gutter {
  padding: var(--s3) 10px var(--s3) var(--s4);
  font-family: var(--ff-mono);
  font-size: .86rem;
  line-height: 1.65;
  color: #6E7681;
  text-align: right;
  user-select: none;
  overflow: hidden;
  border-right: 1px solid #ffffff12;
  white-space: pre;
  box-sizing: border-box;
}
.ed[data-gutter="0"] .ed-gutter { display: none; }
.ed[data-gutter="0"] { grid-template-columns: minmax(0, 1fr); }

/* Asides */
.aside {
  border-left: 2px solid var(--accent);
  background: var(--accent-wash);
  padding: var(--s3) var(--s4);
  border-radius: 0 3px 3px 0;
  font-size: .94rem;
}
.aside.warn { border-left-color: var(--client); background: var(--client-wash); }
.aside .tag {
  display: block;
  font-family: var(--ff-mono);
  font-size: .62rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent-ink);
  margin-bottom: 3px;
}
.aside.warn .tag { color: var(--client); }

/* Data table */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 3px; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th {
  font-family: var(--ff-mono);
  font-size: .66rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--surface-2);
}
tr:last-child td { border-bottom: 0; }
td code { white-space: nowrap; }

/* ── Live editors ────────────────────────────────────────── */
.lab { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); }
.lab-top {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
  padding: var(--s2) var(--s3);
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.lab-top .lang {
  font-family: var(--ff-mono);
  font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.lab-actions { display: flex; gap: var(--s2); }
.run-btn {
  appearance: none;
  font-family: var(--ff-mono);
  font-size: .66rem; letter-spacing: .08em; text-transform: uppercase;
  background: var(--accent); color: #fff;
  border: 0; border-radius: 2px; padding: 4px 11px; cursor: pointer;
}
.run-btn:hover { background: var(--accent-ink); }
:root[data-theme="dark"] .run-btn, .run-btn { color: #04211E; }
.lab textarea {
  width: 100%;
  border: 0;
  resize: vertical;
  padding: var(--s3) var(--s4);
  background: var(--code-bg);
  color: var(--code-ink);
  font-family: var(--ff-mono);
  font-size: .8rem;
  line-height: 1.6;
  min-height: 8.5rem;
  display: block;
  tab-size: 2;
}
.lab textarea:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.lab iframe {
  width: 100%; height: 12rem; border: 0; border-top: 1px solid var(--line);
  background: #fff; display: block;
}
.lab .console {
  border-top: 1px solid var(--line);
  background: var(--code-bg);
  color: var(--code-ink);
  font-family: var(--ff-mono);
  font-size: .78rem;
  padding: var(--s3) var(--s4);
  min-height: 4rem;
  max-height: 14rem;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
.console .err { color: #E88A8A; }
.console .muted { color: var(--tok-com); }

/* ── Exercises ───────────────────────────────────────────── */
.drills { max-width: var(--measure); margin-top: var(--s7); }
.drills-head {
  display: flex; align-items: baseline; gap: var(--s3);
  border-top: 2px solid var(--ink);
  padding-top: var(--s3);
  margin-bottom: var(--s5);
}
.drills-head h3 {
  font-family: var(--ff-display);
  font-size: 1.3rem; font-weight: 600; margin: 0;
}
.drills-head .of {
  font-family: var(--ff-mono);
  font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}

.drill {
  border-bottom: 1px solid var(--line);
  padding: var(--s4) 0;
  display: grid;
  grid-template-columns: 2.4rem 1fr;
  gap: var(--s3);
}
.drill:first-of-type { border-top: 1px solid var(--line); }
.drill .idx {
  font-family: var(--ff-mono);
  font-size: .74rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  padding-top: .18em;
}
.drill-body { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
.drill .q { margin: 0; text-wrap: pretty; }
.drill-tools { display: flex; gap: var(--s2); flex-wrap: wrap; }
.pill {
  appearance: none;
  font-family: var(--ff-mono);
  font-size: .66rem; letter-spacing: .08em; text-transform: uppercase;
  background: transparent; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 11px; cursor: pointer;
}
.pill:hover { color: var(--ink); border-color: var(--muted); }
.pill[aria-expanded="true"] { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-wash); }
.reveal { display: none; flex-direction: column; gap: var(--s3); }
.reveal[data-open="1"] { display: flex; }
.reveal .hint-txt { margin: 0; font-size: .94rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: var(--s3); }
.reveal .ans { margin: 0; font-size: .96rem; }

/* ── Footer nav ──────────────────────────────────────────── */
.done-row {
  max-width: var(--measure);
  margin-top: var(--s6);
  display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
}
.done-btn {
  appearance: none;
  font-family: var(--ff-mono);
  font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
  background: var(--ink); color: var(--bg);
  border: 1px solid var(--ink); border-radius: 2px;
  padding: 8px 16px; cursor: pointer;
}
.done-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .done-btn[aria-pressed="true"] { color: #04211E; }

.pager {
  max-width: var(--measure);
  margin-top: var(--s6);
  padding-top: var(--s4);
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; gap: var(--s3);
}
.pager button {
  appearance: none; background: transparent; border: 0; cursor: pointer;
  color: var(--ink-soft); text-align: left; font: inherit;
  display: flex; flex-direction: column; gap: 2px; max-width: 47%;
  padding: 0;
}
.pager button:last-child { text-align: right; align-items: flex-end; }
.pager button:hover { color: var(--accent-ink); }
.pager button:disabled { opacity: .32; cursor: default; }
.pager .dir {
  font-family: var(--ff-mono);
  font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.pager .ttl { font-size: .92rem; line-height: 1.3; }

/* Planned-lesson state */
.planned-note {
  max-width: var(--measure);
  border: 1px dashed var(--line);
  border-radius: 4px;
  padding: var(--s5);
  display: flex; flex-direction: column; gap: var(--s3);
  background: var(--surface);
}
.planned-note .tag {
  font-family: var(--ff-mono);
  font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.planned-note p { margin: 0; }
.planned-note ul { margin: 0; padding-left: 1.15rem; display: flex; flex-direction: column; gap: 4px; font-size: .94rem; }

.kbd {
  font-family: var(--ff-mono);
  font-size: .72em;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 1px 5px;
  background: var(--surface);
  color: var(--ink-soft);
}

/* ── Responsive ──────────────────────────────────────────── */
.rail-toggle { display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail {
    position: fixed;
    inset: 0 auto 0 0;
    width: min(22rem, 88vw);
    z-index: 40;
    transform: translateX(-101%);
    transition: transform .22s ease;
    box-shadow: 0 0 0 100vmax transparent;
  }
  .rail[data-open="1"] { transform: none; box-shadow: 0 0 0 100vmax #0009; }
  .rail-toggle { display: inline-flex; }
  .lesson { padding: var(--s5) var(--s4) var(--s7); }
  .topbar { padding: var(--s3) var(--s4); }
}

/* ── Topbar status chips ─────────────────────────────────── */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--ff-mono);
  font-size: .68rem;
  letter-spacing: .04em;
  color: var(--ink-soft);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 10px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.chip .glyph { font-size: .8rem; line-height: 1; }
.chip.streak-live { border-color: var(--client); color: var(--client); }
.chip.level { border-color: var(--accent); color: var(--accent-ink); }

/* ── Home / dashboard ────────────────────────────────────── */
.home { padding: var(--s7) var(--s6) var(--s8); max-width: 66rem; }

.hero {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: var(--s5);
  flex-wrap: wrap;
  padding-bottom: var(--s5);
  border-bottom: 2px solid var(--ink);
  margin-bottom: var(--s6);
}
.hero-left { display: flex; flex-direction: column; gap: var(--s2); }
.hero .eyebrow { color: var(--muted); }
.hero h2 {
  font-family: var(--ff-display);
  font-size: clamp(1.9rem, 1.3rem + 2vw, 2.9rem);
  line-height: 1.05;
  font-weight: 600;
  letter-spacing: -.02em;
  margin: 0;
  text-wrap: balance;
}

.xp-block { display: flex; flex-direction: column; gap: 6px; min-width: 15rem; }
.xp-line {
  display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3);
  font-family: var(--ff-mono); font-size: .72rem; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.xp-line strong { color: var(--ink); font-size: .82rem; letter-spacing: .02em; }
.xp-track { height: 7px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.xp-track > i { display: block; height: 100%; background: var(--accent); transition: width .5s cubic-bezier(.2,.8,.2,1); }

/* Continue card */
.continue {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: var(--s4);
  width: 100%;
  text-align: left;
  appearance: none;
  cursor: pointer;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--hue, var(--accent));
  border-radius: 4px;
  padding: var(--s5);
  margin-bottom: var(--s6);
  transition: border-color .15s, transform .15s;
}
.continue:hover { border-color: var(--hue, var(--accent)); transform: translateX(2px); }
.continue .play {
  width: 2.6rem; height: 2.6rem; border-radius: 50%;
  background: var(--hue, var(--accent));
  color: var(--surface);
  display: grid; place-items: center;
  font-size: 1rem;
}
:root[data-theme="dark"] .continue .play { color: #0A100F; }
.continue .meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.continue .kicker {
  font-family: var(--ff-mono); font-size: .64rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted);
}
.continue .name { font-family: var(--ff-display); font-size: 1.25rem; font-weight: 600; line-height: 1.2; }
.continue .why { font-size: .88rem; color: var(--muted); }
.continue .arrow { font-family: var(--ff-mono); color: var(--muted); font-size: 1.1rem; }

/* Section headings on the dashboard */
.home-sec {
  display: flex; align-items: baseline; gap: var(--s3);
  margin: var(--s6) 0 var(--s4);
}
.home-sec h3 {
  font-family: var(--ff-mono); font-size: .7rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 500;
}
.home-sec .rule { flex: 1; height: 1px; background: var(--line); }

/* Track cards with progress rings */
.track-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
  gap: var(--s4);
}
.track-card {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: var(--s4);
  text-align: left;
  appearance: none;
  cursor: pointer;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: var(--s4);
  transition: border-color .15s, background .15s;
}
.track-card:hover { border-color: var(--hue); background: var(--hue-wash); }
.track-card[data-side="server"] { --hue: var(--server); --hue-wash: var(--server-wash); }
.track-card[data-side="client"] { --hue: var(--client); --hue-wash: var(--client-wash); }
.ring { display: block; }
.ring circle { fill: none; stroke-width: 5; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--hue); stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
.ring text {
  font-family: var(--ff-mono); font-size: 13px; fill: var(--ink);
  text-anchor: middle; dominant-baseline: central;
}
.track-card .info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.track-card .tname { font-family: var(--ff-display); font-size: 1.1rem; font-weight: 600; }
.track-card .tmeta { font-family: var(--ff-mono); font-size: .68rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.track-card .tside {
  font-family: var(--ff-mono); font-size: .6rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--hue);
}

/* Achievements */
.badges { display: flex; flex-wrap: wrap; gap: var(--s3); }
.badge {
  display: flex; align-items: center; gap: var(--s3);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: var(--s3) var(--s4);
  background: var(--surface);
  min-width: 13rem;
  flex: 1 1 13rem;
}
.badge[data-locked="1"] { opacity: .45; border-style: dashed; background: transparent; }
.badge .icon {
  font-size: 1.2rem; width: 2rem; height: 2rem;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--accent-wash);
  flex: none;
}
.badge[data-locked="1"] .icon { background: var(--surface-2); filter: grayscale(1); }
.badge .btext { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.badge .bname { font-size: .9rem; font-weight: 600; }
.badge .bhow { font-size: .76rem; color: var(--muted); }

/* Stat strip */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: var(--s3); }
.stat {
  border: 1px solid var(--line); border-radius: 4px;
  padding: var(--s3) var(--s4); background: var(--surface);
  display: flex; flex-direction: column; gap: 2px;
}
.stat .v {
  font-family: var(--ff-mono); font-size: 1.5rem; line-height: 1.1;
  font-variant-numeric: tabular-nums; color: var(--ink);
}
.stat .k {
  font-family: var(--ff-mono); font-size: .62rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
}

/* ── Quiz ────────────────────────────────────────────────── */
.quiz { max-width: var(--measure); margin-top: var(--s7); }
.quiz-head {
  display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap;
  border-top: 2px solid var(--accent);
  padding-top: var(--s3);
  margin-bottom: var(--s5);
}
.quiz-head h3 { font-family: var(--ff-display); font-size: 1.3rem; font-weight: 600; margin: 0; }
.quiz-head .of {
  font-family: var(--ff-mono); font-size: .68rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
}

.q-item { padding: var(--s4) 0; border-bottom: 1px solid var(--line); }
.q-item:first-of-type { border-top: 1px solid var(--line); }
.q-text {
  display: grid; grid-template-columns: 2.4rem 1fr; gap: var(--s3);
  margin: 0 0 var(--s3);
}
.q-text .idx {
  font-family: var(--ff-mono); font-size: .74rem; color: var(--muted);
  font-variant-numeric: tabular-nums; padding-top: .18em;
}
.q-opts { display: flex; flex-direction: column; gap: var(--s2); margin-left: 2.4rem; }

.opt {
  display: grid;
  grid-template-columns: 1.4rem 1fr auto;
  align-items: start;
  gap: var(--s3);
  text-align: left;
  appearance: none;
  font: inherit;
  font-size: .94rem;
  cursor: pointer;
  color: var(--ink-soft);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: var(--s2) var(--s3);
  transition: border-color .12s, background .12s;
}
.opt:hover:not(:disabled) { border-color: var(--muted); color: var(--ink); }
.opt:disabled { cursor: default; }
.opt .mark {
  font-family: var(--ff-mono); font-size: .74rem; color: var(--muted);
  padding-top: .12em;
}
.opt .verdict { font-family: var(--ff-mono); font-size: .8rem; }

.opt[data-state="correct"] {
  border-color: var(--accent); background: var(--accent-wash); color: var(--ink);
}
.opt[data-state="correct"] .mark, .opt[data-state="correct"] .verdict { color: var(--accent-ink); }
.opt[data-state="wrong"] {
  border-color: var(--client); background: var(--client-wash); color: var(--ink);
}
.opt[data-state="wrong"] .mark, .opt[data-state="wrong"] .verdict { color: var(--client); }
.opt[data-state="muted"] { opacity: .5; }

.q-why {
  margin: var(--s3) 0 0 2.4rem;
  font-size: .92rem;
  color: var(--ink-soft);
  border-left: 2px solid var(--accent);
  background: var(--accent-wash);
  border-radius: 0 3px 3px 0;
  padding: var(--s2) var(--s3);
}
.q-why[hidden] { display: none; }

.quiz-foot {
  margin-top: var(--s5);
  display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap;
}
.score {
  display: flex; align-items: center; gap: var(--s3);
  font-family: var(--ff-mono); font-size: .74rem; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.score .bar { width: 8rem; height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.score .bar > i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.score .bar.fail > i { background: var(--client); }
.score strong { color: var(--ink); font-size: .84rem; }

.verdict-line { font-size: .95rem; margin: 0; }
.verdict-line.pass { color: var(--accent-ink); font-weight: 600; }
.verdict-line.fail { color: var(--client); }

/* ── Toast ───────────────────────────────────────────────── */
.toasts {
  position: fixed;
  right: var(--s5); bottom: var(--s5);
  z-index: 90;
  display: flex; flex-direction: column; gap: var(--s2);
  pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: var(--s3);
  background: var(--ink); color: var(--bg);
  border-radius: 4px;
  padding: var(--s3) var(--s4);
  box-shadow: 0 6px 24px #0003;
  max-width: 22rem;
  animation: toast-in .3s cubic-bezier(.2,.8,.2,1);
}
.toast .icon { font-size: 1.2rem; }
.toast .tt { display: flex; flex-direction: column; gap: 1px; }
.toast .tk {
  font-family: var(--ff-mono); font-size: .6rem; letter-spacing: .14em;
  text-transform: uppercase; opacity: .7;
}
.toast .tn { font-size: .9rem; font-weight: 600; }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

/* ═════════════════════════════════════════════════════════
   MOTION
   Entrance runs on navigation only. Feedback runs in place.
   Everything here is switched off by prefers-reduced-motion.
   ═════════════════════════════════════════════════════════ */
@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}
@keyframes pop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.035); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  15% { transform: translateX(-5px); }
  30% { transform: translateX(4px); }
  45% { transform: translateX(-3px); }
  60% { transform: translateX(2px); }
  75% { transform: translateX(-1px); }
}
@keyframes flicker {
  0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
  25% { transform: scale(1.13) rotate(-4deg); opacity: .92; }
  50% { transform: scale(.97) rotate(3deg); opacity: 1; }
  75% { transform: scale(1.08) rotate(-2deg); opacity: .95; }
}
@keyframes sheen {
  from { background-position: -140% 0; }
  to   { background-position: 240% 0; }
}
@keyframes slide-open {
  from { opacity: 0; transform: translateY(-4px); max-height: 0; }
  to   { opacity: 1; transform: none; max-height: 22rem; }
}
@keyframes glow-drift {
  0%   { transform: translate(-8%, -4%) scale(1); }
  50%  { transform: translate(6%, 5%) scale(1.12); }
  100% { transform: translate(-8%, -4%) scale(1); }
}
@keyframes badge-pop {
  0%   { transform: scale(.86); opacity: .4; }
  55%  { transform: scale(1.07); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

/* Staggered entrance — JS sets --i on each child */
.anim-in > * {
  animation: rise .5s cubic-bezier(.2, .8, .2, 1) backwards;
  animation-delay: calc(var(--i, 0) * 45ms);
}
.anim-in .body > * {
  animation: rise .45s cubic-bezier(.2, .8, .2, 1) backwards;
  animation-delay: calc(180ms + var(--j, 0) * 32ms);
}

/* Quiz feedback */
.opt[data-state="correct"].just-answered { animation: pop .42s cubic-bezier(.2, .8, .2, 1); }
.opt[data-state="wrong"].just-answered   { animation: shake .42s ease-in-out; }
.q-why.opening { animation: slide-open .34s cubic-bezier(.2, .8, .2, 1); overflow: hidden; }

/* Live streak flame */
.chip.streak-live .glyph { animation: flicker 2.6s ease-in-out infinite; transform-origin: 50% 80%; }

/* XP bar celebration */
.xp-track.gaining > i {
  background-image: linear-gradient(100deg,
    transparent 20%, #ffffff8c 45%, transparent 70%);
  background-size: 220% 100%;
  animation: sheen 1.1s ease-out 2;
}

/* Ambient glow behind the dashboard hero */
.hero { position: relative; isolation: isolate; }
.hero::before {
  content: "";
  position: absolute;
  inset: -60% -10% -30% 30%;
  z-index: -1;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 22%, transparent), transparent 72%);
  filter: blur(26px);
  opacity: .5;
  animation: glow-drift 17s ease-in-out infinite;
  pointer-events: none;
}

/* Newly unlocked achievement */
.badge.fresh { animation: badge-pop .5s cubic-bezier(.2, .8, .2, 1); }
.badge.fresh .icon { box-shadow: 0 0 0 4px var(--accent-wash); }

/* Hover life */
.track-card { transition: border-color .18s, background .18s, transform .18s cubic-bezier(.2,.8,.2,1); }
.track-card:hover { transform: translateY(-3px); }
.continue .arrow { transition: transform .22s cubic-bezier(.2,.8,.2,1); }
.continue:hover .arrow { transform: translateX(5px); }
.continue .play { transition: transform .22s cubic-bezier(.2,.8,.2,1); }
.continue:hover .play { transform: scale(1.09); }
.syl-item { transition: background .14s, border-color .14s, padding-left .16s; }
.syl-item:hover { padding-left: calc(var(--s3) + 3px); }
.badge { transition: transform .18s, border-color .18s; }
.badge:not([data-locked="1"]):hover { transform: translateY(-2px); border-color: var(--accent); }
.done-btn { transition: background .18s, border-color .18s, transform .12s; }
.done-btn:not(:disabled):active { transform: scale(.97); }
.opt { transition: border-color .12s, background .12s, transform .12s; }
.opt:hover:not(:disabled) { transform: translateX(2px); }

/* Counting numbers must not reflow the layout as digits change */
.stat .v, .xp-line span, .ring text { font-variant-numeric: tabular-nums; }

/* ═════════════════════════════════════════════════════════
   LESSON PATH
   ═════════════════════════════════════════════════════════ */
.path { padding: var(--s7) var(--s6) var(--s8); max-width: 44rem; margin: 0 auto; }
.path-head { display: flex; flex-direction: column; gap: var(--s2); margin-bottom: var(--s6); }
.path-head h2 {
  font-family: var(--ff-display); font-size: clamp(1.8rem, 1.3rem + 1.6vw, 2.5rem);
  font-weight: 600; letter-spacing: -.02em; margin: 0; line-height: 1.1;
}
.path-head .eyebrow { color: var(--hue); }

.path-list { display: flex; flex-direction: column; gap: var(--s5); position: relative; }
.node-row {
  display: flex; align-items: center; gap: var(--s4);
  transform: translateX(calc(var(--x, 0) * 1%));
  position: relative;
}
.node-row::before {
  content: "";
  position: absolute;
  left: 2.1rem; top: -1.9rem; height: 1.9rem; width: 3px;
  background: var(--line);
  border-radius: 2px;
}
.node-row:first-child::before { display: none; }
.node-row[data-state="done"]::before { background: var(--hue); }

.node {
  width: 4.2rem; height: 4.2rem; flex: none;
  border-radius: 50%;

      a: "`Number.isNaN` is the safe check — the older global `isNaN` coerces first, so `isNaN(\"beans\")` is `true` but `isNaN(\"\")` is `false`, which is rarely what you want. This is the JavaScript counterpart of `request.args.get(\"n\", 1, type=int)` on the Flask side.",

  return Number.isNaN(n) ? fallback : n;

/* ── 04 ─────────────────────────────────────────────── */
{
  t: "Operators and truthiness",
  sub: "Arithmetic, logic, and the short-circuit tricks that show up in every real codebase.",
  blocks: [
    ['h', "Arithmetic"],
    ['code', 'js', `10 + 3    // 13
10 - 3    // 7
10 * 3    // 30
10 / 3    // 3.3333333333333335   <- no integer division
10 % 3    // 1
10 ** 3   // 1000

Math.floor(10 / 3)   // 3   — Python's // is spelled like this
Math.round(3.7)      // 4
Math.max(1, 9, 4)    // 9`],
    ['warn', "There is no `//` operator. `10 / 3` always produces a float, because JavaScript has exactly one number type. And `0.1 + 0.2 === 0.3` is `false` — that is IEEE-754 floating point, identical in Python."],
    ['h', "Comparison and logic"],
    ['code', 'js', `a === b    a !== b    a < b    a >= b

a && b     // AND — Python's "and"
a || b     // OR  — Python's "or"
!a         // NOT — Python's "not"`],
    ['h', "Short-circuit: they return a value, not a boolean"],
    ['p', "Just like Python, `&&` and `||` hand back one of their operands rather than `true`/`false`. This is used constantly:"],
    ['code', 'js', `const name = userName || "anonymous";   // fallback if falsy
user.isAdmin && showAdminPanel();      // run only if truthy`],
    ['warn', "`||` treats **every** falsy value as missing — including `0` and `\"\"`. `const count = userCount || 10` turns a legitimate `0` into `10`. This is a real bug people ship."],
    ['h', "`??` — nullish coalescing"],
    ['p', "The fix. `??` falls back only for `null` and `undefined`, leaving `0` and `\"\"` alone:"],
    ['lab', 'js', `const count = 0;
console.log("with ||:", count || 10);   // 10  — wrong
console.log("with ??:", count ?? 10);   // 0   — right

const missing = undefined;
console.log("missing ??:", missing ?? 10);  // 10`],
    ['h', "Optional chaining `?.`"],
    ['code', 'js', `const city = user.address.city;      // TypeError if address is undefined
const city = user.address?.city;    // undefined instead of throwing
const city = user.address?.city ?? "unknown";`],
    ['p', "`?.` and `??` pair naturally: reach in safely, then supply a default. Together they replace most defensive `if` chains."],
    ['h', "Assignment shorthands"],
    ['code', 'js', `count += 1;    count++;     // increment
total *= 2;
name ||= "anon";     // assign if falsy
name ??= "anon";     // assign if null/undefined`],
    ['note', "There is no `++` in Python, and JavaScript has both `count++` (return then increment) and `++count` (increment then return). When in doubt use `count += 1` — it is unambiguous."]
  ],
  ex: [
    { q: "Predict `7 / 2`, `Math.floor(7 / 2)`, `7 % 2` and `-7 % 2`. Which one differs from Python?",
      hint: "Think about the sign of the remainder.",
      a: "`3.5`, `3`, `1`, and `-1`. The last one differs: Python's `-7 % 2` is `1`, because Python's modulo takes the sign of the **divisor**, while JavaScript's takes the sign of the **dividend**. This bites when doing wrap-around index maths with negative numbers." },
    { q: "Why does `const port = userPort || 5000` misbehave when `userPort` is `0`, and how do you fix it?",
      a: "`0` is falsy, so `||` discards it and you get `5000` — even though `0` was a real value the user supplied. Use `const port = userPort ?? 5000`, which only falls back for `null` and `undefined`." },
    { q: "Run the `??` lab, then add a case where `||` and `??` behave identically. When are they the same?",
      hint: "Which values are falsy but not nullish?",
      a: "They differ only for `0`, `-0`, `0n`, `\"\"`, `false` and `NaN` — falsy values that are not nullish. For every other value, including `null`, `undefined`, and anything truthy, the two produce the same answer. Try `const x = null; x || \"d\"` and `x ?? \"d\"` — both give `\"d\"`." },
    { q: "Rewrite this defensive chain as a single line using `?.` and `??`.",
      hint: "Optional chaining stops the whole chain the moment it hits null or undefined.",
      a: "The chain short-circuits to `undefined` at the first missing link, and `??` supplies the default. Note that `?.` protects only the property access immediately after it — `a?.b.c` still throws if `b` is undefined, so chain it at every uncertain step.",
      code: ['js', `// before
let city;
if (user && user.address && user.address.city) {
  city = user.address.city;
} else {
  city = "unknown";
}

// after
const city = user?.address?.city ?? "unknown";`] },
    { q: "Explain what `isAdmin && render()` does and why it appears so often in real code. What is its risk?",
      a: "`&&` evaluates the left side and, if falsy, returns it immediately **without** evaluating the right — so `render()` runs only when `isAdmin` is truthy. It is a compact conditional call. The risk is that the whole expression evaluates to the left operand when it is falsy, so in a context that renders its result (like a UI framework), `count && <List/>` with `count === 0` renders a literal `0` on the page. Convert to a real boolean with `count > 0 && ...` to avoid it." }
  ]
},

      a: "Both properties live on `.card`. Values update the moment you press Run — no reload, because the preview is re-rendered from your text each time." },
    { q: "Delete the closing `}` of the `h2` rule and run. What happens to the `.note` rule below it?",
      hint: "The parser has no way to know where one rule ends.",
      a: "The `h2` rule swallows what follows, and the `.note` rule stops applying. CSS fails **silently** — no error, just missing styles. A single missing brace can disable everything below it, which is why a syntax-highlighting editor is worth having." },
    { q: "Add `// make it big` as a comment inside the editor and run. Then use the correct syntax.",
      hint: "CSS has exactly one comment form.",
      a: "`//` is not valid CSS. The parser treats the line as a broken declaration and skips forward, which can take a valid declaration down with it. Only `/* ... */` works." },
    { q: "Create `static/css/style.css` in your Flask project and link it from `templates/home.html` using `url_for`. Verify it loads.",
      hint: "The browser devtools Network tab shows a 404 if the path is wrong.",
      a: "Put `<link>` inside `<head>`. Check it worked by adding something unmistakable like `body { background: #EDF0EE; }`. If nothing changes, open devtools → Network and look for `style.css` — a `404` means the file is not where Flask expects, a `200` means the path is fine and your selector is the problem.",
      code: ['jinja', `<head>
  <title>My Flask Home</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>`] },
    { q: "Why is `url_for('static', filename='css/style.css')` better than writing `/static/css/style.css` directly?",
      a: "Two reasons. It survives the app being mounted under a prefix (`/myapp/static/...`) — a hardcoded path would 404. And it goes through the same route map as everything else, so it stays consistent with how you build every other URL. The habit matters more than this one file: hardcoded URLs are the thing that quietly breaks when a project grows." }
  ]
},

/* ── 02 ─────────────────────────────────────────────── */
{
  t: "Selectors",
  sub: "Choosing exactly which elements a rule applies to.",
  blocks: [
    ['h', "The basics"],
    ['code', 'css', `h2          { }   /* every <h2> — type selector */
.note       { }   /* every element with class="note" */
#header     { }   /* the element with id="header" */
*           { }   /* everything */
h2, .note   { }   /* both — a selector list */`],
    ['p', "**Use classes for nearly everything.** Type selectors are too broad, and IDs are so specific they become impossible to override later."],
    ['h', "Combinators — relationships between elements"],
    ['tbl',
      ["Selector", "Means"],
      [
        ["`.card p`", "Any `p` **anywhere inside** `.card` (descendant)"],
        ["`.card > p`", "A `p` that is a **direct child** of `.card`"],
        ["`h2 + p`", "The `p` **immediately after** an `h2` (adjacent sibling)"],
        ["`h2 ~ p`", "**Every** `p` after an `h2`, same parent (general sibling)"]
      ]
    ],
    ['p', "The space in `.card p` is itself an operator — it means “descendant”. `.card.active` with no space is different: one element carrying **both** classes."],
    ['h', "Attribute selectors"],
    ['code', 'css', `[disabled]              { }   /* has the attribute at all */
[type="submit"]         { }   /* exact value */
[href^="https"]         { }   /* starts with */
[href$=".pdf"]          { }   /* ends with */
[class*="btn"]          { }   /* contains */`],
    ['h', "Pseudo-classes — state"],
    ['code', 'css', `button:hover      { }   /* pointer over it */
button:focus      { }   /* keyboard focus */
input:disabled    { }
li:first-child    { }
li:last-child     { }
li:nth-child(2n)  { }   /* every second one */
p:not(.note)      { }   /* every p that is not .note */`],
    ['warn', "Never remove focus styling with `outline: none` unless you replace it with something equally visible. Keyboard users navigate entirely by the focus ring — deleting it makes a site unusable for them. `:focus-visible` shows the ring for keyboard users while hiding it for mouse clicks."],
    ['h', "Pseudo-elements — parts of an element"],
    ['code', 'css', `.note::before { content: "→ "; }
.note::first-line { font-weight: 600; }`],
    ['p', "One colon for a **state** (`:hover`), two for a generated **part** (`::before`). A `::before` needs a `content` property or it will not render at all."],
    ['lab', 'css', `/* Try changing which elements these target. */
.card > h2 {
  color: #2F4E93;
  border-bottom: 2px solid #DFE5F3;

.card p:not(.hidden) {
  color: #596763;

  background: #0E7C70;

    { q: "In the live editor, write a rule that targets the button by its class and gives it a rounded border. Then target it by element type instead. Which is better here?",

/* ── 03 ─────────────────────────────────────────────── */
{
  t: "The cascade and specificity",
  sub: "Why your rule is not applying — the single most common CSS frustration, explained properly.",
  blocks: [
    ['p', "When two rules set the same property on the same element, the browser resolves it in a fixed order. Learn the order and “why isn't my CSS working?” mostly stops happening."],
    ['h', "The resolution order"],
    ['ul', [
      "**Origin** — your stylesheet beats the browser's defaults.",
      "**Specificity** — the more specific selector wins. This is where most conflicts are decided.",
      "**Source order** — if specificity ties, the rule written **last** wins.",
      "`!important` sits above all of it. Treat it as a last resort."
    ]],
    ['h', "Counting specificity"],
    ['p', "Three numbers, compared left to right like version numbers: **(ids, classes, elements)**."],
    ['tbl',
      ["Selector", "Score", "Notes"],
      [
        ["`p`", "0,0,1", "one element"],
        ["`.note`", "0,1,0", "one class — beats any number of elements"],
        ["`.card p`", "0,1,1", ""],
        ["`.card .note`", "0,2,0", "beats `.card p`"],
        ["`#header`", "1,0,0", "one id beats any number of classes"],
        ["`:hover`, `[type=x]`", "counts as a class", ""],
        ["`::before`", "counts as an element", ""],
        ["`*`", "0,0,0", "adds nothing"],
        ["`:not(.x)`", "the argument counts, `:not` itself does not", ""]
      ]
    ],
    ['warn', "It is not decimal. `0,1,0` beats `0,0,15` — eleven element selectors still lose to one class. Left column first, always."],
    ['lab', 'css', `/* Both set the h2 colour. Which wins, and why? */
h2 {
  color: red;          /* 0,0,1 */
}

.card h2 {
  color: #2F4E93;      /* 0,1,1  -> this one */
}

/* Same specificity: last one wins. Swap them and re-run. */
.note { color: #A96A22; }
.note { color: #596763; }`],
    ['h', "Inheritance"],
    ['p', "Some properties pass down to children automatically — `color`, `font-family`, `font-size`, `line-height`, `text-align`. Most do not: `border`, `padding`, `background`, `width`. Setting `font-family` once on `body` is why you rarely repeat it."],
    ['p', "Inherited values lose to **any** rule that targets the element directly, no matter how weak. A `p { color: black }` beats an inherited blue from `body`."],
    ['h', "Escaping `!important`"],
    ['code', 'css', `.note { color: red !important; }   /* now nothing can override it normally */`],
    ['p', "It works, and it is almost always a mistake. It signals that specificity has got out of hand, and the only way to beat it later is another `!important` — an arms race. Fix the selector instead. The honest exceptions: overriding a third-party stylesheet you cannot edit, and utility classes."],
    ['h', "Keeping specificity low"],
    ['ul', [
      "Prefer a single class: `.card-title`, not `div.card > h2.title`.",
      "Avoid IDs in stylesheets. Keep them for JavaScript hooks and anchors.",
      "Never nest more than two or three levels deep.",
      "If you are reaching for `!important`, look for the over-specific rule that made you."
    ]]
  ],
  ex: [
    { q: "Score these: `.card h2`, `h2.title`, `#main h2`, `.card .title`.",
      a: "`.card h2` = 0,1,1. `h2.title` = 0,1,1 — a tie, so source order decides. `#main h2` = 1,0,1, which beats both. `.card .title` = 0,2,0, which beats both of the first two but still loses to the ID." },
    { q: "In the live editor, both `h2` and `.card h2` set a colour. Predict the winner, then swap their order and re-run.",
      hint: "Does source order matter when specificity differs?",
      a: "`.card h2` wins at 0,1,1 against 0,0,1 — and it keeps winning after you swap them. Source order is only consulted when specificity **ties**, which is exactly what happens with the two `.note` rules below." },
    { q: "You set `.note { color: green }` but the text is still grey. List three things to check before adding `!important`.",
      a: "**1.** Open devtools, inspect the element, and look at the Styles panel — a rule crossed out shows you exactly what overrode it and where. **2.** Check the selector actually matches: is the class spelled right, is it on the element you think? **3.** Check for a syntax error in a rule *above* yours — an unclosed brace disables everything after it. `!important` should come after all three, and usually you will not need it." },
    { q: "Add `!important` to the losing `h2` rule in the editor. It now wins. Explain why this is a trap.",
      a: "You have made that declaration unoverridable by any normal rule, including future ones written specifically to handle a special case. The only escape is another `!important` with higher specificity. Two or three rounds of that and the stylesheet becomes genuinely unmaintainable — which is why the fix is to lower the *winning* selector's specificity, not raise the loser's weight." },
    { q: "Which of `color`, `padding`, `font-family`, `border` are inherited? What is the practical consequence?",
      hint: "Think about which ones would look absurd if every child copied them.",
      a: "`color` and `font-family` inherit; `padding` and `border` do not. Imagine if they did — every nested element would draw its own copy of the parent's border, and padding would compound at every level. The practical consequence is that typography is set once high up (usually on `body`) and flows down, while box properties must be set on each element that needs them." }
  ]
},

/* ── 04 ─────────────────────────────────────────────── */
{
  t: "The box model",
  sub: "Every element is a rectangle. Understanding its four layers explains most unexpected layout.",
  blocks: [
    ['p', "From the inside out: **content**, then **padding**, then **border**, then **margin**."],
    ['code', 'text', `┌─────────────── margin ───────────────┐
│  ┌──────────── border ────────────┐  │
│  │  ┌────────  padding  ───────┐  │  │
│  │  │        content           │  │  │
│  │  └──────────────────────────┘  │  │
│  └────────────────────────────────┘  │
└──────────────────────────────────────┘`],
    ['ul', [
      "**padding** — space *inside* the border. Takes the element's background.",
      "**border** — the line itself.",
      "**margin** — space *outside*. Always transparent."
    ]],
    ['h', "The sizing trap"],
    ['p', "By default `width: 300px` sets the width of the **content box** only. Padding and border are added on top:"],
    ['code', 'css', `.box {
  width: 300px;
  padding: 20px;
  border: 2px solid;
}
/* actual rendered width: 300 + 20 + 20 + 2 + 2 = 344px */`],
    ['h', "The fix everyone applies"],
    ['code', 'css', `*, *::before, *::after {
  box-sizing: border-box;
}`],
    ['p', "Now `width: 300px` means the element occupies exactly 300px, with padding and border fitting **inside**. Put this at the top of every stylesheet you write. It is the first rule in the stylesheet for this very page."],
    ['h', "Shorthand order"],
    ['code', 'css', `padding: 10px;                    /* all four sides */
padding: 10px 20px;               /* vertical | horizontal */
padding: 10px 20px 30px;          /* top | horizontal | bottom */
padding: 10px 20px 30px 40px;     /* top right bottom left — clockwise */

padding-block: 10px;              /* top and bottom */
padding-inline: 20px;             /* left and right */`],
    ['note', "The four-value order is clockwise from the top: **T R B L**. Mnemonic: **TRouBLe**."],
    ['h', "Margin collapse"],
    ['p', "Adjacent **vertical** margins merge into one — the larger of the two, not their sum. A 30px bottom margin next to a 20px top margin gives 30px of space, not 50px. Horizontal margins never collapse."],
    ['warn', "Margin collapse is the reason spacing is often smaller than you expect. It disappears inside a flex or grid container, which is one more reason to use `gap` for spacing between siblings instead of margins on each one."],
    ['lab', 'css', `.card {
  box-sizing: border-box;
  width: 280px;
  padding: 20px;
  border: 3px solid #2F4E93;
  background: #DFE5F3;
}

/* Delete the box-sizing line and run again —
   the card gets wider than 280px. */

.cta {
  padding: 8px 20px;
  margin-top: 12px;
  border: 1px solid #2F4E93;
  background: white;
}`]
  ],
  ex: [
    { q: "An element has `width: 200px; padding: 15px; border: 5px solid`. How wide is it on screen with the default box-sizing, and with `border-box`?",
      a: "Default (`content-box`): 200 + 15 + 15 + 5 + 5 = **240px**. With `border-box`: exactly **200px**, with the content squeezed to 160px to make room. The margin is outside the box in both cases and never counts toward the width." },
    { q: "In the live editor, delete the `box-sizing` line and run. Describe what changes and why.",
      a: "The card grows to 280 + 40 padding + 6 border = 326px. Nothing about your `width` declaration changed — only what that number is measured against. This is exactly the surprise `border-box` was invented to remove." },
    { q: "Write a padding shorthand for 10px top, 24px left and right, 30px bottom.",
      hint: "Three values means top | horizontal | bottom.",
      a: "Both are correct; the three-value form is shorter, the logical-property form reads more clearly and adapts automatically to right-to-left languages — worth knowing if you ever build a Hebrew interface.",
      code: ['css', `padding: 10px 24px 30px;

/* or, more explicitly */
padding-block-start: 10px;
padding-inline: 24px;
padding-block-end: 30px;`] },
    { q: "Two stacked paragraphs: the first has `margin-bottom: 40px`, the second `margin-top: 20px`. How much space is between them?",
      hint: "They do not add.",
      a: "**40px** — the larger of the two. Vertical margins between adjacent siblings collapse into a single margin. If you genuinely need 60px, put the two in a flex column with `gap: 60px`, which does not collapse." },
    { q: "You want 20px of space between every child of a container. Compare `margin-bottom` on each child with `gap` on the container.",
      a: "`margin-bottom` on every child leaves an unwanted 20px hanging off the last one, needing a `:last-child { margin-bottom: 0 }` patch — and the margins may collapse with the container's own. `display: flex; flex-direction: column; gap: 20px` puts space **between** items only, never at the ends, and never collapses. Let the layout own the spacing." }
  ]
},

/* ── 05 ─────────────────────────────────────────────── */
{
  t: "Units that scale",
  sub: "px, rem, em, %, vh — and why the choice decides whether your page survives a zoom.",
  blocks: [
    ['h', "Absolute"],
    ['p', "`px` is the only absolute unit worth using. One CSS pixel is a fixed reference size — predictable, and correct for things that should not scale: borders, hairlines, small offsets."],
    ['h', "Relative to font size"],
    ['tbl',
      ["Unit", "Relative to", "Use for"],
      [
        ["`rem`", "the **root** font size (16px by default)", "almost everything: type, spacing, widths"],
        ["`em`", "the **current element's** font size", "spacing that should track its own text size"],
        ["`ch`", "the width of a `0` in the current font", "line lengths — `max-width: 65ch`"],
        ["`ex`", "the x-height", "rarely needed"]
      ]
    ],
    ['p', "**Default to `rem`.** A user who raises their browser's base font size for readability gets a page that scales with them. A page built in `px` ignores that setting entirely — an accessibility failure, not a style preference."],
    ['warn', "`em` compounds. Nest three elements each with `font-size: 1.2em` and the innermost is 1.73× the base. That runaway is why `rem` — which always refers to the root — is the safer default."],
    ['h', "Relative to the container"],
    ['code', 'css', `width: 50%;        /* half the parent's width */
width: 100vw;      /* full viewport width */
height: 100vh;     /* full viewport height */
height: 100dvh;    /* dynamic — accounts for mobile browser chrome */`],
    ['warn', "`100vw` includes the scrollbar's width on desktop, so a full-width element can trigger a horizontal scrollbar. `width: 100%` usually does what you actually meant."],
    ['h', "`clamp()` — the modern answer to responsive sizing"],
    ['code', 'css', `font-size: clamp(1.5rem, 1rem + 2vw, 3rem);
/*                minimum   preferred   maximum */`],
    ['p', "The middle value scales with the viewport; the outer two stop it going too small or too large. One declaration replaces a stack of media queries — the heading on this page uses exactly this."],
    ['lab', 'css', `.card {
  padding: 1.5rem;
  max-width: 30rem;
  border: 1px solid #D2D9D6;
}

h2 {
  /* resize the preview pane and watch it respond */
  font-size: clamp(1.2rem, 1rem + 2vw, 2.4rem);
  margin-top: 0;
}

.note {
  font-size: 0.875rem;
  max-width: 45ch;
}`],
    ['h', "Rules of thumb"],
    ['ul', [
      "Font sizes: `rem`.",
      "Spacing: `rem`, from a scale (0.25 / 0.5 / 1 / 1.5 / 2 / 3).",
      "Borders and hairlines: `px`.",
      "Text column width: `ch`, around 60–75.",
      "Full-height sections: `dvh` over `vh` on mobile.",
      "Fluid type: `clamp()`."
    ]]
  ],
  ex: [
    { q: "With a root font size of 16px, how many pixels are `1rem`, `1.5rem` and `0.875rem`?",
      a: "16px, 24px and 14px. The last is a common body-secondary size — `0.875rem` is preferred over `14px` because it still scales when a user changes their browser default." },
    { q: "Three nested divs each have `font-size: 1.2em`, starting from 16px. What is the innermost size? What if they used `rem`?",
      hint: "`em` multiplies at each level.",
      a: "With `em`: 16 × 1.2³ = **27.6px**, compounding at every level. With `rem`: **19.2px** at every level, because `rem` always refers to the root and never to the parent. This compounding is the single best argument for `rem` as the default." },
    { q: "In the live editor, change the `h2` to a fixed `font-size: 2rem`, then drag the preview narrower. Compare with the `clamp` version.",
      a: "The fixed version stays 32px and eventually crowds or overflows on a narrow pane. The `clamp` version shrinks smoothly down to its 1.2rem floor and grows to its 2.4rem ceiling, with no media queries involved." },
    { q: "Explain when `em` is the *right* choice over `rem`.",
      hint: "Think about a button whose padding should track its own text.",
      a: "When a value should scale with the element's **own** font size rather than the page's. Button padding is the classic case: `padding: 0.5em 1em` keeps the padding proportional whether that button is large or small, so one rule serves every size. Same for a `::before` icon sized in `em` — it stays aligned with the text it sits beside." },
    { q: "Write a fluid heading that is never smaller than 1.5rem, never larger than 3rem, and scales in between. Explain each of the three values.",
      hint: "The middle value needs a viewport unit to be fluid at all.",
      a: "**Minimum** 1.5rem — the floor on narrow screens. **Preferred** `1rem + 2.5vw` — a fixed base plus a viewport-relative part; including the `rem` term is what keeps the text scalable when a user zooms, which a pure `vw` value would break. **Maximum** 3rem — the ceiling on wide monitors, so the heading does not become absurd.",
      code: ['css', `h1 {
  font-size: clamp(1.5rem, 1rem + 2.5vw, 3rem);
}`] }
  ]
},

/* ── 06 ─────────────────────────────────────────────── */
{
  t: "Color",
  sub: "Hex, rgb, hsl and the modern functions — plus the contrast rule that is not optional.",
  blocks: [
    ['h', "The notations"],
    ['code', 'css', `color: #0E7C70;                    /* hex */
color: #0E7C70CC;                  /* hex + alpha */
color: rgb(14 124 112);            /* red green blue, 0-255 */
color: rgb(14 124 112 / 0.8);      /* with alpha */
color: hsl(174 79% 27%);           /* hue saturation lightness */
color: hsl(174 79% 27% / 0.8);`],
    ['h', "Why `hsl` is worth learning"],
    ['p', "Hex is opaque to a human reader — you cannot look at `#0E7C70` and know what changing it will do. `hsl` names the three things you actually want to adjust:"],
    ['ul', [
      "**Hue** 0–360 on the colour wheel: 0 red, 120 green, 240 blue.",
      "**Saturation** 0–100%: grey to vivid.",
      "**Lightness** 0–100%: black to white, with 50% the pure hue."
    ]],
    ['p', "That makes a coherent palette straightforward: hold hue and saturation, vary lightness, and you get a set of tints that genuinely belong together."],
    ['lab', 'css', `/* Same hue, different lightness — a real palette. */
.card {
  background: hsl(174 40% 96%);
  border: 1px solid hsl(174 40% 80%);
  padding: 1.25rem;
}
h2   { color: hsl(174 79% 22%); margin-top: 0; }
.note { color: hsl(174 15% 40%); }
.cta {
  background: hsl(174 79% 27%);
  color: white;
  border: 0;
  padding: .6rem 1.2rem;
  border-radius: 4px;
}
/* Change 174 to 25 everywhere and re-run: same design, new identity. */`],
    ['h', "Contrast is a requirement, not a preference"],
    ['p', "Text must be readable. The WCAG thresholds are the accepted standard:"],
    ['tbl',
      ["Content", "Minimum ratio"],
      [
        ["Body text", "**4.5:1** against its background"],
        ["Large text (18pt+/14pt bold)", "3:1"],
        ["UI borders, icons, focus rings", "3:1"]
      ]
    ],
    ['p', "Browser devtools check this for you: inspect an element, click the colour swatch in the Styles panel, and the contrast ratio is shown with a pass/fail mark."],
    ['warn', "Grey-on-grey is the most common failure. `#999` on white is 2.85:1 — it fails, even though it looks fine to someone with good eyesight on a good monitor. Muted text still needs to clear 4.5:1."],
    ['h', "`currentColor` and custom properties"],
    ['code', 'css', `.btn {
  color: #0E7C70;
  border: 1px solid currentColor;   /* follows color automatically */
}

:root {
  --accent: hsl(174 79% 27%);
  --accent-wash: hsl(174 40% 94%);
}
.cta { background: var(--accent); }`],
    ['p', "Custom properties are the foundation of theming — one definition, used everywhere, swapped in a single place for dark mode. Lesson 16 covers them fully."],
    ['h', "Colour alone is never enough"],
    ['p', "Around 1 in 12 men has some form of colour blindness. A red/green status indicator that carries no other signal is invisible to them. Always pair colour with a second cue: an icon, a label, a shape, a border style."]

    ['code', 'python', `import os, shutil

def move_no_clobber(src, dst_dir):

  streakEl.classList.toggle('streak-live', days >= 2);
  streakEl.title = days >= 2
    ? days + ' consecutive days — best run ' + state.streak.best
    : 'Come back tomorrow to start a streak';

  const lv = levelFor(state.xp);
  document.getElementById('chip-level').innerHTML =
    '<span class="glyph">◆</span>Lv ' + lv.index + ' · ' + state.xp + ' XP';
  document.getElementById('chip-level').title =
    lv.name + (lv.toNext ? ' — ' + lv.toNext + ' XP to ' + LEVELS[lv.index].name : ' — top level');
}

/* ── Dashboard ───────────────────────────────────────────── */
function ring(pct, hue) {
  const r = 22, c = 2 * Math.PI * r;
  const off = c * (1 - pct / 100);
  /* Starts empty; playMeters() transitions it to data-target so the ring draws. */
  return '<svg class="ring" width="56" height="56" viewBox="0 0 56 56" aria-hidden="true" style="--hue:' + hue + '">' +
    '<circle class="bg" cx="28" cy="28" r="' + r + '"></circle>' +
    '<circle class="fg" cx="28" cy="28" r="' + r + '" ' +
    'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + c.toFixed(1) + '" ' +
    'data-target="' + off.toFixed(1) + '" ' +
    'transform="rotate(-90 28 28)"></circle>' +
    '<text x="28" y="29" data-count="' + Math.round(pct) + '">0</text></svg>';
}

let freshBadges = new Set();

function renderHome(opts) {

  const written = writtenCount();

  const quizTotal = TRACK_IDS.reduce((n, t) => n + COURSE[t].lessons.filter(l => l.quiz).length, 0);

  const returning = state.done.size > 0 || state.xp > 0;

  h += '<header class="hero"><div class="hero-left">' +

    '</div><div class="xp-block">' +
    '<div class="xp-line"><strong>Level ' + lv.index + ' · ' + esc(lv.name) + '</strong>' +
    '<span><b data-count="' + state.xp + '">0</b> XP</span></div>' +
    '<div class="xp-track"><i style="width:0" data-target="' + Math.min(100, lv.pct).toFixed(1) + '%"></i></div>' +
    '<div class="xp-line"><span>' +
    (lv.toNext ? lv.toNext + ' XP to ' + esc(LEVELS[lv.index].name) : 'Top level reached') +

      '<code>os.path.join</code>, <code>makedirs(exist_ok=True)</code> and the <code>__file__</code> anchor. ' +

      '<span class="kicker">All written lessons complete</span>' +
      '<span class="name">Nothing left in the queue</span>' +

  /* Stats */
  h += '<div class="home-sec"><h3>At a glance</h3><span class="rule"></span></div><div class="stats">' +
    '<div class="stat"><span class="v"><b data-count="' + state.done.size + '">0</b></span><span class="k">lessons done</span></div>' +
    '<div class="stat"><span class="v"><b data-count="' + passed + '">0</b><span style="font-size:.8rem;color:var(--muted)">/' + quizTotal + '</span></span><span class="k">checks passed</span></div>' +
    '<div class="stat"><span class="v"><b data-count="' + state.xp + '">0</b></span><span class="k">total XP</span></div>' +
