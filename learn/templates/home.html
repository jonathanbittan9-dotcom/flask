<!doctype html>
<html>
  <head>
    <title>My Flask Home</title>
  </head>
  <body>
    <h1>Hello, {{ name }}</h1>
    {% if hobbies %}
      <ul>

      <p>go to touch some grass</p>
    {% endif %}
    
    <p>This page lives in its own HTML file.</p>
  </body>
</html>
